<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="生活公司每日誌:投資、新聞、新竹房地產、育兒景點美食、小說漫畫動畫的每日看板。">
<meta property="og:title" content="每日誌 · 生活公司">
<meta property="og:description" content="每天一頁,五大分類精選重點。">
<title>每日誌 · 生活公司</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f7f3ea; --cream2:#f3ecdd; --panel:#fffdf8; --card:#ffffff;
    --ink:#2a2823; --sub:#6f685b; --faint:#a99f8c; --line:#e7ddc9;
    --green:#2f4a3f; --green-d:#24382f; --tagbg:#efe7d6;
    --serif:"Noto Serif TC",Georgia,"Songti TC",serif;
    --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    --shadow:0 1px 2px rgba(60,50,30,.05),0 10px 30px rgba(60,50,30,.07);
    --c-invest:#3a6b5f; --c-news:#4a6076; --c-house:#2f4a3f; --c-life:#b06a86; --c-fun:#6d5aa6;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.65;
    background:
      radial-gradient(1100px 380px at 78% -60px, #f7e8dd 0%, rgba(247,232,221,0) 60%),
      radial-gradient(900px 360px at 12% -40px, #f0efe0 0%, rgba(240,239,224,0) 55%),
      var(--cream);
    -webkit-font-smoothing:antialiased;min-height:100vh}
  a{color:inherit;text-decoration:none}

  .topbar{position:sticky;top:0;z-index:60;background:rgba(247,243,234,.82);
    backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line)}
  .tin{max-width:1160px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:14px}
  .word{font-family:var(--serif);font-weight:900;font-size:22px;letter-spacing:1px;display:flex;align-items:baseline;gap:9px}
  .word small{font-family:var(--sans);font-weight:500;font-size:12px;letter-spacing:2px;color:var(--faint);text-transform:uppercase}
  .tnav{margin-left:auto;display:flex;align-items:center;gap:10px}
  .btn-green{background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;border:none;cursor:pointer}
  .tnav a.plain{font-size:13px;color:var(--sub);padding:8px 6px}
  .tnav a.plain:hover{color:var(--green)}

  main{max-width:1160px;margin:0 auto;padding:26px 22px 90px}

  .hero{background:var(--panel);border:1px solid var(--line);border-radius:22px;
    box-shadow:var(--shadow);padding:22px 26px 24px;position:relative;overflow:hidden}
  .hero-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .daybtn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
  .daybtn:disabled{opacity:.4;cursor:default}
  .datebadge{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;
    color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 13px}
  .kicker{font-size:13px;letter-spacing:3px;color:var(--faint);font-weight:600}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,4vw,40px);
    line-height:1.28;margin:8px 0 12px;letter-spacing:1px}
  .hero .lead{color:var(--sub);font-size:14.5px;margin:0}
  .todaypill{display:inline-block;margin-top:14px;background:var(--cream2);color:var(--green);
    font-size:12px;font-weight:700;padding:5px 14px;border-radius:999px;border:1px solid var(--line)}

  .filters{display:flex;flex-wrap:wrap;gap:9px;margin:26px 2px 6px}
  .fpill{font-size:13.5px;font-weight:600;color:var(--sub);background:#fff;border:1px solid var(--line);
    padding:9px 17px;border-radius:999px;cursor:pointer;transition:.15s}
  .fpill:hover{border-color:var(--green)}
  .fpill.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .cat{margin-top:34px;scroll-margin-top:80px}
  .cathead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
  .cathead h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:0;letter-spacing:.5px}
  .cathead .csub{font-size:13px;color:var(--faint)}
  .cathead .count{margin-left:auto;font-size:12.5px;color:var(--faint);font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .16s,box-shadow .16s}
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(60,50,30,.13)}
  .media{position:relative;height:172px;display:grid;place-items:center;overflow:hidden}
  .media img{width:100%;height:100%;object-fit:contain;background:#fff}
  .media .glyph{font-size:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
  .media .wm{position:absolute;right:14px;bottom:10px;font-family:var(--serif);font-weight:900;
    font-size:15px;color:rgba(255,255,255,.9);letter-spacing:2px}
  .num{position:absolute;top:12px;left:12px;background:rgba(30,28,22,.82);color:#fff;
    font-size:12.5px;font-weight:800;padding:3px 11px;border-radius:999px;letter-spacing:.5px}
  .body{padding:15px 17px 16px;display:flex;flex-direction:column;flex:1}
  .srcrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .srcrow .dot{width:9px;height:9px;border-radius:50%}
  .srcrow .sname{font-size:12.5px;font-weight:700;color:var(--sub)}
  .srcrow .status{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--green)}
  .card h3{font-family:var(--serif);font-weight:700;font-size:16.5px;line-height:1.4;margin:0 0 7px}
  .card h3 .ext{font-size:12px;color:var(--faint);margin-left:3px}
  .card p{margin:0;font-size:13.5px;color:var(--sub);flex:1}
  .tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
  .tag{font-size:11.5px;color:var(--sub);background:var(--tagbg);padding:3px 10px;border-radius:999px;font-weight:600}

  .disc{margin-top:40px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;
    padding:15px 20px;color:var(--sub);font-size:12.5px}
  footer{text-align:center;color:var(--faint);font-size:12px;margin-top:24px;line-height:1.9}

  @media(max-width:620px){
    .grid{grid-template-columns:1fr}
    .word{font-size:19px}.word small{display:none}
    .tnav a.plain{display:none}
    main{padding:18px 14px 70px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="tin">
      <div class="word">每日誌 <small>Daily Digest</small></div>
      <nav class="tnav">
        <button class="btn-green" onclick="window.scrollTo({top:0,behavior:'smooth'})">每日看板</button>
        <a class="plain" href="#filters">分類彙整</a>
      </nav>
    </div>
  </div>

  <main>
    <section class="hero">
      <div class="hero-top">
        <button class="daybtn" id="prevBtn">‹ 前一天</button>
        <button class="daybtn" id="nextBtn">後一天 ›</button>
        <span class="datebadge">📅 <span id="dateBadge">2026/08/02</span></span>

      <div class="kicker" id="kicker">2026 年 8 月 2 日 · 週日</div>
      <h1 id="headline">—</h1>
      <p class="lead" id="lead">每個類別精選當日重點,點卡片可前往原始來源。</p>
      <span class="todaypill" id="todaypill">今天</span>
    </section>

    <div class="filters" id="filters"><!-- filter pills by JS --></div>

    <div id="report"><!-- sections by JS --></div>

      每日更新投資、新聞、新竹房產;每週五加碼育兒好去處與新番。</div>
    <footer>每日誌 · 生活公司 Life Company　由 AI 團隊(投資分析師／房產分析師／育兒顧問／娛樂潮流)自動彙整</footer>

  function mediaHTML(cat,n){
    const m=cat.media;
    const inner = m.type==="img"
      ? `<img src="${m.src}" alt="${esc(cat.name)}">`
      : `<div class="glyph">${m.glyph}</div>${m.wm?`<span class="wm">${m.wm}</span>`:""}`;
    const bg = m.type==="img" ? "background:#fff" : `background:${m.grad}`;
    return `<div class="media" style="${bg}"><span class="num">#${n}</span>${inner}</div>`;
  }
  function cardHTML(cat,item,n){
    const tags=(item.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("");
    const ext=item.url?`<span class="ext">↗</span>`:"";
    const wrapS=item.url?`<a href="${esc(item.url)}" target="_blank" rel="noopener">`:`<div>`;
    const wrapE=item.url?`</a>`:`</div>`;
    return `<div class="card">${mediaHTML(cat,n)}
      <div class="body">
        <div class="srcrow"><span class="dot" style="background:${cat.accent}"></span>
          <span class="sname">${esc(item.src)}</span>
          ${item.status?`<span class="status">${esc(item.status)}</span>`:""}</div>
        ${wrapS}<h3>${esc(item.title)}${ext}</h3>${wrapE}
        <p>${esc(item.desc)}</p>
        ${tags?`<div class="tags">${tags}</div>`:""}
      </div></div>`;
  }

      if(filter!=="all"&&filter!==c.key) return;
      const items=r[c.key]||[]; if(!items.length) return;
      html+=`<section class="cat" id="${c.id}">
        <div class="cathead"><h2>${c.name}</h2><span class="csub">${c.csub}</span>
          <span class="count">最熱門 ${items.length} 則</span></div>
        <div class="grid">${items.map((it,i)=>cardHTML(c,it,i+1)).join("")}</div>
      </section>`;
    });
    $("#report").innerHTML=html;
  }
  function renderHero(){
    const r=REPORTS[idx];
    $("#dateBadge").textContent=r.ymd;
    $("#kicker").textContent=r.kicker;
    $("#headline").textContent=r.headline;
    $("#todaypill").style.display=r.isToday?"inline-block":"none";
    $("#prevBtn").disabled=idx>=REPORTS.length-1;
    $("#nextBtn").disabled=idx<=0;
  }
  $("#prevBtn").onclick=()=>{if(idx<REPORTS.length-1){idx++;renderHero();renderReport();window.scrollTo({top:0,behavior:"smooth"});}};
  $("#nextBtn").onclick=()=>{if(idx>0){idx--;renderHero();renderReport();window.scrollTo({top:0,behavior:"smooth"});}};
  renderFilters();renderHero();renderReport();
  </script>
</body>
</html>
